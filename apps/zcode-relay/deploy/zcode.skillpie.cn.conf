# zcode.skillpie.cn 站点配置 —— drop-in 到 skillpie 服务器的 /etc/nginx/conf.d/
# 注意：不能 include skillpie_common.conf —— 它内部定义了代理到 Next.js backend 的
# location /，与本静态站点冲突（nginx 禁止同 server 内重复 location）。SSL 参数按其等值复制。
# 静态 Web：/var/www/zcode（packages/web 的 vite build 产物，VITE_TUNNEL_ENTRY=1 构建）
# relay：/relay/ 剥前缀反代本机 8787（控制面 REST + 数据面 WS）
# transport TLS 由 nginx 终结；隧道业务帧由两端 PSK 端到端加密，nginx/relay 只见密文。

upstream zcode_relay {
    server 127.0.0.1:8787;
}

server {
    listen 80;
    server_name zcode.skillpie.cn;

    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zcode.skillpie.cn;

    # 复用服务器上已有的 *.skillpie.cn 通配符证书（deploy.sh --ng 同源）
    ssl_certificate /etc/nginx/ssl/skillpie.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/skillpie.cn.key;

    # —— 与 skillpie_common.conf 等值的 SSL 参数（无法 include，见文件头注释）——
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # 静态 Web（SPA）：vite build 产物
    root /var/www/zcode;
    index index.html;

    # 带内容 hash 的资源长缓存
    location ^~ /assets/ {
        expires 365d;
        access_log off;
    }

    # 终端用户发行下载：install.sh + 各平台 stage 归档（deploy-zcode.sh --release 发布）
    location = /install.sh {
        alias /var/www/zcode-dl/install.sh;
        default_type text/x-shellscript;
        add_header Content-Disposition inline;
    }

    location ^~ /dl/ {
        alias /var/www/zcode-dl/;
        autoindex off;
        expires 1h;
    }

    # 隧道 relay：REST /relay/api/v1/* + WS /relay/ws/*
    # 宿主连接器拨 wss://zcode.skillpie.cn/relay（末尾斜杠剥 /relay 前缀）
    location /relay/ {
        proxy_pass http://zcode_relay/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 隧道是长连接：宿主 15s 心跳，读超时须远大于心跳间隔
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 业务帧是端到端密文，缓冲与压缩无意义且增加延迟
        proxy_buffering off;
        gzip off;
    }

    # SPA 回退（放最后）
    location / {
        try_files $uri /index.html;
    }
}
